
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Callback Service</title>
</head>
<body>
  <p>Opening Callback Service...</p>

  <script>
    (() => {
      const LOCAL_APP = "xbetmulti://open/callback";
      const GLOBAL_APP = "xbet://open/callback";
      const WEBSITE = "https://1xbet.com/ar/office/support";

      const isMobile =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (!isMobile) {
        window.location.replace(WEBSITE);
        return;
      }

      // Attempt the local app first.
      window.location.href = LOCAL_APP;

      // If it does not open, attempt the global app.
      setTimeout(() => {
        window.location.href = GLOBAL_APP;

        // If neither app opens, use the website.
        setTimeout(() => {
          window.location.replace(WEBSITE);
        }, 2000);

      }, 2000);
    })();
  </script>

  <p>
    If the redirect does not work:
    <a href="xbetmulti://open/callback">Local app</a> |
    <a href="xbet://open/callback">Global app</a> |
    <a href="https://support-links.info/me_callback">Website</a>
  </p>
</body>
</html>
