
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Callback</title>
</head>
<body>
  <p>Redirecting to Callback Service...</p>

  <script>
    (function () {
      const LOCAL_APP = "xbetmulti://open/callback";
      const GLOBAL_APP = "xbet://open/callback";
      const WEBSITE = "https://support-links.info/me_callback";

      const isMobile =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (!isMobile) {
        window.location.replace(WEBSITE);
        return;
      }

      let appOpened = false;

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) appOpened = true;
      });

      window.addEventListener("pagehide", function () {
        appOpened = true;
      });

      // First attempt: local application.
      window.location.href = LOCAL_APP;

      // Second attempt: global application.
      setTimeout(function () {
        if (appOpened || document.hidden) return;

        window.location.href = GLOBAL_APP;

        // Final fallback: website.
        setTimeout(function () {
          if (!appOpened && !document.hidden) {
            window.location.replace(WEBSITE);
          }
        }, 1800);

      }, 1800);
    })();
  </script>

  <p>
    If redirection does not work,
    <a href="xbetmulti://open/callback">Open local app</a> |
    <a href="xbet://open/callback">Open global app</a> |
    <a href="https://support-links.info/me_callback">Open website</a>
  </p>
</body>
</html>
