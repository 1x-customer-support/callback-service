
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Callback Service</title>
</head>
<body>
  <p>Opening Callback Service...</p>

  <script>
    const LOCAL_APP = "xbetmulti://open/callback";
    const GLOBAL_APP = "xbet://open/callback";
    const WEBSITE = "https://support-links.info/me_callback";

    let finished = false;

    // Stop trying if the browser moves to the app.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) finished = true;
    });

    window.addEventListener("pagehide", () => {
      finished = true;
    });

    function tryGlobalApp() {
      if (finished) return;

      location.href = GLOBAL_APP;

      setTimeout(() => {
        if (!finished && !document.hidden) {
          finished = true;
          location.replace(WEBSITE);
        }
      }, 1800);
    }

    // Try the local app first.
    location.href = LOCAL_APP;

    // If it doesn't open, try the global app.
    setTimeout(tryGlobalApp, 1800);
  </script>
</body>
</html>
